services:
  activation-service-remote-1:
    network_mode: "host"
    image: spacemeshos/go-spacemesh-dev:2c898bb30
    command:
      [
        "-c",
        "/config.json",
        "--node-service-address",
        "http://testnet-16-node-service.spacemesh.network:9099",
        "--grpc-json-listener",
        "0.0.0.0:19071",
        "--proxy-api-v2-address",
        "http://testnet-16-node-service.spacemesh.network",
        "--grpc-public-listener",
        "0.0.0.0:19082",
        "--grpc-private-listener",
        "0.0.0.0:19083",
        "--json-cors-everywhere",
      ]
    volumes:
      - ./spacemesh-client-remote-1:/tmp/spacemesh-client
      - ./config.testnet-16-smesher-service.json:/config.json
    ports:
      - 19071:19071
      - 19072:19072
      - 19082:19082
      - 19083:19083

  activation-service-remote-2:
    network_mode: "host"
    image: spacemeshos/go-spacemesh-dev:2c898bb30
    command:
      [
        "-c",
        "/config.json",
        "--node-service-address",
        "http://testnet-16-node-service.spacemesh.network:9099",
        "--grpc-json-listener",
        "0.0.0.0:19171",
        "--proxy-api-v2-address",
        "http://testnet-16-node-service.spacemesh.network",
        "--grpc-public-listener",
        "0.0.0.0:19182",
        "--grpc-private-listener",
        "0.0.0.0:19183",
        "--json-cors-everywhere",
      ]
    volumes:
      - ./spacemesh-client-remote-2:/tmp/spacemesh-client
      - ./config.testnet-16-smesher-service.json:/config.json
    ports:
      - 19171:19171
      - 19172:19172
      - 19182:19182
      - 19183:19183

  node-service-multi:
    network_mode: "host"
    image: spacemeshos/go-spacemesh-dev:2c898bb30
    command: [
        "-c",
        "/config.json",
        "--grpc-json-listener",
        "0.0.0.0:19060",
        "--grpc-public-listener",
        "0.0.0.0:19062",
        "--grpc-private-listener",
        "0.0.0.0:19063",
        # "--node-service-listener",
        # "0.0.0.0:19099", ## this is somehow not exposed via CLI
      ]
    volumes:
      - ./spacemesh-node-service-multi:/tmp/spacemesh-node-service
      - ./config.testnet.node-service.merged-multi.json:/config.json
    # networks:
    #   - spacemesh-testnet
    ports:
      - 19062:19062
      - 19063:19063
      - 19060:19060
      - 19099:19099
