version: "3"

services:
  activation-service:
    image: spacemeshos/go-spacemesh-dev:7d2f6ce47
    command:
      [
        "-c",
        "/config.json",
        "--node-service-address",
        "http://node-service:9099",
        "--grpc-json-listener",
        "0.0.0.0:9071",
        "--proxy-api-v2-address",
        "http://node-service:9070",
        "--proxy-listener",
        "0.0.0.0:9072",
      ]
    volumes:
      - ./spacemesh-client:/tmp/spacemesh-client
      - ./config.testnet.client.merged.json:/config.json
    ports:
      - 9071:9071
    networks:
      - spacemesh-testnet

  node-service:
    image: spacemeshos/go-spacemesh-dev:7d2f6ce47
    command: ["-c", "/config.json", "--grpc-json-listener", "0.0.0.0:9070"]
    volumes:
      - ./spacemesh-node-service:/tmp/spacemesh-node-service
      - ./config.testnet.node-service.merged.json:/config.json
    networks:
      - spacemesh-testnet
    ports:
      - 9092:9092
      - 9093:9093

networks:
  spacemesh-testnet:
    driver: bridge
