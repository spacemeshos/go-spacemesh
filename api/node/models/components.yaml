components:
  schemas:
    ActivationTx:
      type: object
      properties:
        ID:
          $ref: "#/components/schemas/Bytes32"
        SmesherID:
          $ref: "#/components/schemas/Bytes32"
        PublishEpoch:
          type: integer
          format: uint32
        NumUnits:
          type: integer
          format: uint32
        TickCount:
          type: integer
          format: uint64
        Weight:
          type: integer
          format: uint64
        Sequence:
          type: integer
          format: uint64
      required:
        - PublishEpoch
        - NumUnits
        - TickCount
        - SmesherID
        - ID
        - Weight

    MerkleProof:
      type: object
      properties:
        root:
          type: string
          format: byte
        provenLeaves:
          type: array
          items:
            type: string
            format: byte
        proofNodes:
          type: array
          items:
            type: string
            format: byte
      required:
        - root
        - provenLeaves
        - proofNodes

    PoetProof:
      type: object
      properties:
        proof:
          $ref: "#/components/schemas/MerkleProof"
        leafs:
          type: integer
          format: uint64
        statement:
          $ref: "#/components/schemas/Bytes32"
        id:
          type: string
          format: byte
        round:
          type: string
      required:
        - id
        - round
        - proof
        - leafs
        - statement

    EpochID:
      type: integer
      format: uint32
    LayerID:
      type: integer
      format: uint32
    HareIter:
      type: integer
      format: uint8
    HareRound:
      type: integer
      format: uint8
    Bytes20:
      type: string
      format: byte
      minLength: 28
      maxLength: 28
    Bytes32:
      type: string
      format: byte
      minLength: 44
      maxLength: 44
    Beacon:
      type: string
      format: byte
      minItems: 12
      maxItems: 12
    HareRoundTemplate:
      type: object
      properties:
        Proposals:
          type: array
          items:
            $ref: "#/components/schemas/Bytes20"
          description: Array of 32-byte proposal IDs encoded as hex strings
        Reference:
          $ref: "#/components/schemas/Bytes32"
          description: Optional 32-byte reference hash
      required:
        - Proposals
    Vote:
      type: object
      properties:
        ID:
          $ref: "#/components/schemas/Bytes20"
        LayerID:
          $ref: "#/components/schemas/LayerID"
        Height:
          type: integer
          format: uint64
      required:
        - ID
        - LayerID
        - Height
    Votes:
      type: object
      properties:
        Base:
          $ref: "#/components/schemas/Bytes20"
        Support:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        Against:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        Abstain:
          type: array
          items:
            $ref: "#/components/schemas/LayerID"
      required:
        - Base
        - Support
        - Against
        - Abstain
    EpochData:
      type: object
      properties:
        ActiveSetHash:
          $ref: "#/components/schemas/Bytes32"
        Beacon:
          $ref: "#/components/schemas/Beacon"
        EligibilityCount:
          type: integer
          format: uint32
      required:
        - ActiveSetHash
        - Beacon
        - EligibilityCount
    Ballot:
      type: object
      properties:
        AtxID:
          $ref: "#/components/schemas/Bytes32"
        OpinionHash:
          $ref: "#/components/schemas/Bytes32"
        RefBallotID:
          $ref: "#/components/schemas/Bytes20"
        EpochData:
          $ref: "#/components/schemas/EpochData"
        Votes:
          $ref: "#/components/schemas/Votes"
      required:
        - AtxID
        - OpinionHash
        - Votes

    PartialProposal:
      type: object
      properties:
        Ballot:
          $ref: "#/components/schemas/Ballot"
        VrfNonce:
          type: integer
          format: uint64
        MeshHash:
          $ref: "#/components/schemas/Bytes32"
        TxIDs:
          type: array
          items:
            $ref: "#/components/schemas/Bytes32"
      required:
        - VrfNonce
        - TxIDs
        - Ballot
        - MeshHash
