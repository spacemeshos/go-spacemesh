[package]
name = "multisig"
version = "0.1.0"
edition = "2021"

[dependencies]
parity-scale-codec = { version = "3.6.12", features = ["derive"] }

# athena-interface = { git = "https://github.com/athenavm/athena", tag = "v0.6.1" }
# athena-vm = { git = "https://github.com/athenavm/athena", tag = "v0.6.1" }
# athena-vm-declare = { git = "https://github.com/athenavm/athena", tag = "v0.6.1" }
# athena-vm-sdk = { git = "https://github.com/athenavm/athena", tag = "v0.6.1" }
athena-interface = { path = "/home/bartosz/workspace/athena/interface" }
athena-vm = { path = "/home/bartosz/workspace/athena/vm/entrypoint" }
athena-vm-declare = { path = "/home/bartosz/workspace/athena/vm/declare" }
athena-vm-sdk = { path = "/home/bartosz/workspace/athena/vm/sdk" }

[dev-dependencies]
multisig = { path = ".", features = ["unittest"] }
# athena-sdk = { git = "https://github.com/athenavm/athena", tag = "v0.6.1" }
# athena-runner = { git = "https://github.com/athenavm/athena", tag = "v0.6.1" }
athena-sdk = { path = "/home/bartosz/workspace/athena/sdk" }
athena-runner = { path = "/home/bartosz/workspace/athena/runner" }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }

rand = "0.8.5"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[build-dependencies]
athena-helper = { git = "https://github.com/athenavm/athena", tag = "v0.6.1" }

[features]
unittest = []

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
